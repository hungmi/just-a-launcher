name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore keystore
        run: echo "$KEYSTORE_B64" | base64 -d > release.p12
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - name: Build
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: tvhome
      - uses: actions/upload-artifact@v4
        with:
          name: just-a-launcher-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk just-a-launcher.apk
          cp just-a-launcher.apk "just-a-launcher-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" just-a-launcher.apk "just-a-launcher-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes
